<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>MonEcole — Nettoyage</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));background:linear-gradient(135deg,#eef2f7,#dbeafe);font-family:Arial,sans-serif;color:#0f172a}
      section{width:min(480px,100%);background:#fff;border:1px solid #bfdbfe;border-radius:20px;padding:28px;text-align:center;box-shadow:0 24px 70px rgba(15,23,42,.18)}
      h1{font-size:22px;margin:12px 0 8px}
      p{font-size:14px;line-height:1.6;color:#64748b}
      button,a{display:inline-block;border:0;border-radius:11px;padding:12px 16px;background:#1a56db;color:#fff;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer}
      .secondary{background:#f1f5f9;color:#334155;margin-left:8px}
      @media(max-width:420px){section{padding:22px 16px}button,a{display:block;width:100%;margin:8px 0!important}}
      #status{margin-top:14px;font-size:12px;color:#64748b}
    </style>
  </head>
  <body>
    <section>
      <div style="width:50px;height:50px;margin:0 auto;display:grid;place-items:center;border-radius:14px;background:#1a56db;color:#fff;font-size:14px;font-weight:900">ME</div>
      <h1>Nettoyer l’ancienne version</h1>
      <p>Cette page supprime le cache MonEcole et relance l’application proprement. Les données Supabase ne sont pas supprimées.</p>
      <button id="clean" type="button">Nettoyer et relancer</button>
      <a class="secondary" href="./">Retour</a>
      <div id="status" role="status" aria-live="polite"></div>
    </section>
    <script>
      async function cleanAndGo() {
        const status = document.getElementById("status");
        status.textContent = "Nettoyage en cours…";
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(reg => reg.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(key => key.startsWith("monecole-")).map(key => caches.delete(key)));
          }
          try {
            localStorage.removeItem("monecole_pending_version");
            localStorage.removeItem("monecole_pending_label");
            localStorage.removeItem("monecole_pending_client_update");
            localStorage.removeItem("monecole_app_version");
            localStorage.removeItem("monecole_last_loaded_version");
          } catch {}
          status.textContent = "Terminé. Relance…";
          location.replace("./?clean=" + Date.now());
        } catch (error) {
          status.textContent = "Nettoyage partiel. Rechargez la page.";
          setTimeout(() => location.replace("./?clean=" + Date.now()), 1200);
        }
      }
      document.getElementById("clean").addEventListener("click", cleanAndGo);
      setTimeout(cleanAndGo, 600);
    </script>
  </body>
</html>
